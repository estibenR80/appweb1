# Entorno de STAGING: levanta todos los microservicios, el gateway y una
# base de datos compartida en un volumen. Permite pruebas de integración y
# rendimiento end-to-end.
#
# Uso:  docker compose up --build
#       docker compose run --rm seed   # poblar datos de ejemplo

services:
  seed:
    build: .
    command: node shared/seed.js
    environment:
      - NODE_ENV=staging
      - DB_FILE=/data/techstore.db
    volumes:
      - techstore-data:/data

  auth:
    build: .
    command: node services/auth/src/server.js
    environment:
      - NODE_ENV=staging
      - DB_FILE=/data/techstore.db
      - JWT_SECRET=${JWT_SECRET:-staging-secret}
    volumes:
      - techstore-data:/data
    ports:
      - "3001:3001"

  catalog:
    build: .
    command: node services/catalog/src/server.js
    environment:
      - NODE_ENV=staging
      - DB_FILE=/data/techstore.db
    volumes:
      - techstore-data:/data
    ports:
      - "3002:3002"

  cart:
    build: .
    command: node services/cart/src/server.js
    environment:
      - NODE_ENV=staging
      - DB_FILE=/data/techstore.db
      - JWT_SECRET=${JWT_SECRET:-staging-secret}
      - CATALOG_URL=http://catalog:3002
      - PAYMENT_URL=http://payment:3004
      - SHIPPING_URL=http://shipping:3005
    volumes:
      - techstore-data:/data
    ports:
      - "3003:3003"
    depends_on: [catalog, payment, shipping]

  payment:
    build: .
    command: node services/payment/src/server.js
    environment:
      - NODE_ENV=staging
      - DB_FILE=/data/techstore.db
      - JWT_SECRET=${JWT_SECRET:-staging-secret}
    volumes:
      - techstore-data:/data
    ports:
      - "3004:3004"

  shipping:
    build: .
    command: node services/shipping/src/server.js
    environment:
      - NODE_ENV=staging
      - DB_FILE=/data/techstore.db
      - JWT_SECRET=${JWT_SECRET:-staging-secret}
    volumes:
      - techstore-data:/data
    ports:
      - "3005:3005"

  gateway:
    build: .
    command: node gateway/src/server.js
    environment:
      - NODE_ENV=staging
      - GATEWAY_PORT=8080
      - AUTH_URL=http://auth:3001
      - CATALOG_URL=http://catalog:3002
      - CART_URL=http://cart:3003
      - PAYMENT_URL=http://payment:3004
      - SHIPPING_URL=http://shipping:3005
    ports:
      - "8080:8080"
    depends_on: [auth, catalog, cart, payment, shipping]

volumes:
  techstore-data:
